<title>ThaiCoin Pitch Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans+Thai:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: letterboxed 16:9 film stage, transport bar beneath, chapters grouped by act. Single dark look by choice. */
:root{
  --ink:#070b14; --ink-2:#0e1626; --line:#1d2a44; --paper:#f3efe6; --mute:#8a97b3;
  --gold:#f0b94a; --blue:#5c8cff; --teal:#37d7c8; --rose:#ff5c7a;
  --f-display:'Bricolage Grotesque','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-thai:'IBM Plex Sans Thai','Bricolage Grotesque',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body{background:var(--ink);color:var(--paper);font-family:var(--f-display);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.top h1 span{color:var(--gold)}
.meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:#000;border-radius:6px;overflow:hidden;container-type:inline-size;border:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.big{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;display:flex;align-items:center;gap:14px;padding:14px 26px 14px 18px;border-radius:999px;border:1px solid rgba(243,239,230,.45);background:rgba(7,11,20,.62);color:var(--paper);font:700 clamp(14px,2cqw,22px)/1 var(--f-display);cursor:pointer;backdrop-filter:blur(6px)}
.big svg{width:clamp(22px,3.2cqw,38px);height:auto;fill:var(--gold)}
.big:hover{background:rgba(7,11,20,.8)}
.chip{position:absolute;left:12px;top:12px;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border-radius:999px;background:rgba(240,185,74,.14);border:1px solid var(--gold);color:var(--gold)}
.bar{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:14px}
.time{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap}
.time b{color:var(--paper);font-weight:500}
input[type=range]{width:100%;min-width:0;accent-color:var(--gold);height:28px;margin:0;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:8px}
button.b{font:600 13px var(--f-display);color:var(--paper);background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:9px 15px;cursor:pointer}
button.b:hover{border-color:var(--mute)}
button.b[aria-pressed=true]{border-color:var(--teal);color:var(--teal)}
button.b.main{background:var(--gold);border-color:var(--gold);color:#1a1205;min-width:92px}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hint{font-size:12.5px;color:var(--mute)}
.hint kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--paper)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px 20px;margin-top:6px}
.act h2{margin:0 0 8px;font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;gap:8px}
.act ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ch{width:100%;display:grid;grid-template-columns:48px 1fr;text-align:left;gap:8px;padding:9px 10px;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--paper);font:500 14px var(--f-display);cursor:pointer}
.ch:hover{background:var(--ink-2)}
.ch[aria-current=true]{background:var(--ink-2);border-color:var(--line);color:var(--gold)}
.ch i{font:500 12px var(--f-mono);color:var(--mute);font-style:normal;font-variant-numeric:tabular-nums;padding-top:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.clean{overflow:hidden}
body.clean .wrap{max-width:none;padding:0;display:block}
body.clean .wrap>:not(.stage){display:none}
body.clean .stage{position:fixed;inset:0;margin:auto;width:min(100vw,177.78vh);border:0;border-radius:0}
body.clean .chip{display:none}
@media (max-width:560px){.bar{grid-template-columns:auto 1fr}.bar .time{grid-column:1/-1;order:3}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Thai<span>Coin</span> pitch film</h1>
    <div class="meta">3:00 · Origins Hackathon · TOKEN2049 Singapore · Agentic payments</div>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="ThaiCoin pitch film"></canvas>
    <div class="chip" id="chip" hidden>Placeholder · swap for live screen recording</div>
    <button class="big" id="big" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg><span id="bigl">Play film · 3:00</span></button>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>

  <div class="bar">
    <button class="b main" id="play" type="button">Play</button>
    <div class="time"><b id="tnow">0:00</b> / 3:00</div>
    <input type="range" id="scrub" min="0" max="180" step="0.05" value="0" aria-label="Timeline">
  </div>

  <div class="btns">
    <button class="b" id="restart" type="button">Restart</button>
    <button class="b" id="bcap" type="button" aria-pressed="true">Captions</button>
    <button class="b" id="bsnd" type="button" aria-pressed="true">Sound</button>
    <button class="b" id="bnar" type="button" aria-pressed="false">Narration (browser voice)</button>
    <button class="b" id="bclean" type="button">Clean mode</button>
    <button class="b" id="bfs" type="button">Fullscreen</button>
    <button class="b" id="brec" type="button" hidden>Record WebM</button>
  </div>
  <p class="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> 5s · <kbd>[</kbd><kbd>]</kbd> scene · <kbd>H</kbd> clean mode (hides every control for screen capture, <kbd>Esc</kbd> to exit) · <kbd>F</kbd> fullscreen</p>

  <div class="acts" id="acts"></div>
</div>

<script>
(()=>{
'use strict';
const W=1920,H=1080,TAU=Math.PI*2;
const cv=document.getElementById('cv');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
if(!ctx.roundRect){ctx.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();};}

/* ---------- tokens ---------- */
const GOLD='240,185,74',BLUE='92,140,255',TEAL='55,215,200',ROSE='255,92,122',PAPER='243,239,230',VIOLET='150,110,255';
const rgba=(c,a)=>`rgba(${c},${a})`;
const F_D="'Bricolage Grotesque','IBM Plex Sans Thai',sans-serif";
const F_T="'IBM Plex Sans Thai','Bricolage Grotesque',sans-serif";
const F_M="'JetBrains Mono',ui-monospace,monospace";

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const sm=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const eo=x=>1-Math.pow(1-clamp(x),3);
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const R=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const kf=(t,k)=>{if(t<=k[0][0])return k[0][1];for(let i=1;i<k.length;i++){if(t<=k[i][0]){const[t0,v0]=k[i-1],[t1,v1]=k[i];return v0+(v1-v0)*sm(0,1,(t-t0)/(t1-t0))}}return k[k.length-1][1]};
const mkPath=(kx,ky)=>t=>({x:kf(t,kx),y:kf(t,ky)});
const bob=(t,a=10,f=2)=>Math.sin(t*f)*a;
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r)};

/* ---------- text ---------- */
function txt(s,x,y,o={}){
  ctx.save();
  ctx.font=`${o.w||600} ${o.s||32}px ${o.f||F_D}`;
  ctx.textAlign=o.a||'left';ctx.textBaseline=o.b||'alphabetic';
  if(o.ls)ctx.letterSpacing=o.ls+'px';
  ctx.globalAlpha*=(o.al??1);
  ctx.fillStyle=o.c||`rgb(${PAPER})`;
  ctx.fillText(s,x,y);
  ctx.restore();
}
function pill(s,x,y,c=TEAL,al=1,o={}){
  ctx.save();ctx.globalAlpha*=al;
  const sz=o.s||22;
  ctx.font=`500 ${sz}px ${F_M}`;ctx.letterSpacing='2px';
  const w=ctx.measureText(s).width+40,h=sz+26;
  ctx.fillStyle=rgba(c,.13);ctx.strokeStyle=rgba(c,.75);ctx.lineWidth=2;
  rr(x,y-h/2,w,h,h/2);ctx.fill();ctx.stroke();
  ctx.fillStyle=`rgb(${o.tc||c})`;ctx.textBaseline='middle';ctx.fillText(s,x+20,y+1);
  ctx.restore();return w;
}

/* ---------- atmosphere ---------- */
function glow(x,y,r,c,a=1){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,rgba(c,a));g.addColorStop(1,rgba(c,0));
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.restore();
}
function sky(a,b,c){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(.55,b);g.addColorStop(1,c);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function bokeh(t,n,cols,seed=0,al=.12){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const x=R(i+seed)*W+Math.sin(t*.2+i)*30,y=R(i*3+seed)*H,r=30+R(i*5+seed)*90;
    ctx.fillStyle=rgba(cols[i%cols.length],al*(.5+.5*Math.sin(t*.6+i*2)));
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function rain(t,n,al,seed=0){
  ctx.save();ctx.strokeStyle=`rgba(190,215,255,${al})`;ctx.lineWidth=1.6;ctx.beginPath();
  for(let i=0;i<n;i++){
    const sp=900+R(i*3+seed)*700,x0=R(i+seed)*(W+300)-150,y=((R(i+99+seed)*H+t*sp)%(H+120))-60;
    ctx.moveTo(x0,y);ctx.lineTo(x0+8,y+40);
  }
  ctx.stroke();ctx.restore();
}
function dust(t,n,seed=0,al=.8){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<n;i++){
    const x=(R(i+seed)*W+Math.sin(t*.4+i)*40)%W,y=H-((R(i*2+seed)*H+t*(14+R(i)*30))%H);
    ctx.fillStyle=rgba(GOLD,al*(.3+.7*Math.abs(Math.sin(t*1.3+i))));
    ctx.beginPath();ctx.arc(x,y,1+R(i*7)*2.4,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function fog(a=.9,from=.55){const g=ctx.createLinearGradient(0,H*from,0,H);g.addColorStop(0,'rgba(7,11,20,0)');g.addColorStop(1,`rgba(7,11,20,${a})`);ctx.fillStyle=g;ctx.fillRect(0,H*from,W,H)}

/* ---------- Bangkok skyline ---------- */
function mkCity(seed,hMin,hMax,wMin,wMax){
  const a=[];let x=-140,i=0;
  while(x<W+240){const w=wMin+R(seed+i*1.7)*(wMax-wMin),h=hMin+R(seed+i*2.9+5)*(hMax-hMin);a.push({x,w,h,id:seed*100+i});x+=w+R(seed+i*4.1)*10;i++}
  return a;
}
const farCity=mkCity(3,140,360,50,110),midCity=mkCity(11,200,560,70,150);
function drawCity(arr,base,fill,winCol,winAl,t,dx=0,thr=.62){
  ctx.fillStyle=fill;
  for(const b of arr)ctx.fillRect(b.x+dx,base-b.h,b.w+1,b.h+700);
  ctx.fillStyle=rgba(winCol,winAl);ctx.beginPath();
  for(const b of arr){
    const cols=Math.floor((b.w-12)/18),rows=Math.floor((b.h-20)/26);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const k=R(b.id*31+r*7+c*3);
      if(k>thr){if(k>.97&&Math.sin(t*3+k*50)>.2)continue;ctx.rect(b.x+dx+8+c*18,base-b.h+14+r*26,8,12)}
    }
  }
  ctx.fill();
}
function prang(x,base,h,fill){
  ctx.fillStyle=fill;const w=h*.42;
  ctx.fillRect(x-w/2,base-h*.12,w,h*.12+700);
  let y=base-h*.12;
  for(let i=0;i<5;i++){
    const wb=w*(1-i*.17),th=h*.13,wt=wb*.74;
    ctx.beginPath();ctx.moveTo(x-wb/2,y);ctx.lineTo(x-wt/2,y-th);ctx.lineTo(x+wt/2,y-th);ctx.lineTo(x+wb/2,y);ctx.closePath();ctx.fill();
    ctx.fillRect(x-wb/2-6,y-3,wb+12,6);y-=th*.96;
  }
  ctx.beginPath();ctx.moveTo(x-8,y);ctx.lineTo(x,y-h*.2);ctx.lineTo(x+8,y);ctx.fill();
}
function tower(x,base,h,fill){
  ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x-46,base);ctx.lineTo(x-30,base-h*.9);ctx.lineTo(x+30,base-h*.9);ctx.lineTo(x+46,base);ctx.fill();
  ctx.beginPath();ctx.ellipse(x,base-h*.92,44,26,0,0,TAU);ctx.fill();ctx.fillRect(x-3,base-h*1.12,6,h*.22);
  ctx.fillStyle=rgba(GOLD,.45);for(let k=0;k<6;k++)ctx.fillRect(x-26+k*2,base-h*(.18+k*.12),52-k*4,4);
}

/* ---------- objects ---------- */
function gem(x,y,s,c=TEAL,al=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha*=al;
  ctx.fillStyle=rgba(c,.95);ctx.beginPath();ctx.moveTo(-.5,-.2);ctx.lineTo(-.25,-.55);ctx.lineTo(.25,-.55);ctx.lineTo(.5,-.2);ctx.fill();
  ctx.fillStyle=rgba(c,.55);ctx.beginPath();ctx.moveTo(-.5,-.2);ctx.lineTo(0,-.2);ctx.lineTo(0,.6);ctx.fill();
  ctx.fillStyle=rgba(c,.32);ctx.beginPath();ctx.moveTo(.5,-.2);ctx.lineTo(0,-.2);ctx.lineTo(0,.6);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=.04;ctx.beginPath();ctx.moveTo(-.5,-.2);ctx.lineTo(.5,-.2);ctx.lineTo(0,.6);ctx.closePath();ctx.stroke();
  ctx.restore();
}
function phone(x,y,w,h,rot,fn,glowC){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  if(glowC)glow(0,0,w*1.5,glowC,.32);
  ctx.fillStyle='#0a0e18';ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=3;
  rr(-w/2,-h/2,w,h,w*.12);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.roundRect(-w/2+10,-h/2+10,w-20,h-20,w*.1);ctx.clip();
  ctx.translate(-w/2+10,-h/2+10);fn(w-20,h-20);
  ctx.restore();
}
function crane(x,y,s,rot,ph,tint=BLUE,u=1){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  glow(0,0,150,tint,.38*u);
  const grad=ctx.createLinearGradient(-60,-40,60,20);grad.addColorStop(0,'rgba(255,255,255,.95)');grad.addColorStop(1,rgba(tint,.95));
  const f=Math.sin(ph),fb=Math.sin(ph-.45);
  const tip=(ff,k)=>[-30-Math.abs(ff)*6,lerp(-72,34,(ff+1)/2)*k];
  ctx.globalAlpha*=clamp(u*1.6);
  const wing=(ff,fill,k)=>{
    const [tx,ty]=tip(ff,k);
    ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(-14,-6);ctx.lineTo(20,-10);ctx.lineTo(tx,ty);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.3;ctx.stroke();
    ctx.beginPath();ctx.moveTo(3,-8);ctx.lineTo(tx,ty);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.stroke();
  };
  wing(fb,rgba(tint,.5),u);
  ctx.fillStyle=grad;ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.3;
  const poly=pts=>{ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)ctx.lineTo(...pts[i]);ctx.closePath();ctx.fill();ctx.stroke()};
  poly([[-34,6],[-62,-8],[-26,-1]]);
  poly([[-34,6],[-4,-9],[28,-5],[8,15]]);
  poly([[24,-6],[48,-36],[54,-31],[30,3]]);
  poly([[48,-36],[64,-31],[53,-29]]);
  ctx.beginPath();ctx.moveTo(-4,-9);ctx.lineTo(8,15);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.stroke();
  wing(f,'rgba(255,255,255,.88)',u);
  if(u<1){
    ctx.globalAlpha=(1-u)*.9;const q=46*(1-u*.6);
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.fillStyle=rgba(tint,.25);
    ctx.beginPath();ctx.moveTo(0,-q);ctx.lineTo(q,0);ctx.lineTo(0,q);ctx.lineTo(-q,0);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-q,0);ctx.lineTo(q,0);ctx.moveTo(0,-q);ctx.lineTo(0,q);ctx.stroke();
  }
  ctx.restore();
}
const headingOf=(p,t)=>{const a=p(t),b=p(t+.08);return clamp(Math.atan2(b.y-a.y,b.x-a.x),-.6,.6)*.7};
function trail(p,t,n,step,c,size,al=.35){for(let k=1;k<=n;k++){const q=p(t-k*step),f=1-k/n;glow(q.x,q.y,size*f+4,c,al*f)}}
function ribbon(p,t,n,step,wave,al=1,c=GOLD){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let k=0;k<n;k++){
    const q=p(t-k*step),f=1-k/n,off=Math.sin(t*6-k*.5)*wave*f;
    ctx.fillStyle=rgba(c,.85*f*al);ctx.beginPath();ctx.arc(q.x,q.y+off,3+5*f,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function coin(x,y,r,spin,al=1){
  const c=Math.cos(spin),s=Math.sin(spin),w=Math.max(Math.abs(c)*r,2),th=r*.2*Math.abs(s)+4,dir=s>=0?1:-1;
  ctx.save();ctx.globalAlpha*=al;
  glow(x,y,r*2,GOLD,.35);
  for(let i=0;i<=10;i++){
    const o=(i/10-.5)*th*dir*-1;
    ctx.fillStyle=`rgb(${lerp(150,205,i/10)|0},${lerp(100,150,i/10)|0},${lerp(30,55,i/10)|0})`;
    ctx.beginPath();ctx.ellipse(x+o,y,w,r,0,0,TAU);ctx.fill();
  }
  const fo=th/2*dir*(c>0?-1:1)*-1*-1;
  ctx.save();ctx.translate(x+(c>0?th/2*dir*-1:th/2*dir),y);ctx.scale(Math.abs(c)||.01,1);
  const g=ctx.createRadialGradient(-r*.3,-r*.35,r*.1,0,0,r);g.addColorStop(0,'#ffe9ae');g.addColorStop(.55,'#f0b94a');g.addColorStop(1,'#b87a1d');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
  ctx.strokeStyle='rgba(120,70,10,.55)';ctx.lineWidth=r*.035;ctx.beginPath();ctx.arc(0,0,r*.88,0,TAU);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*.66,0,TAU);ctx.stroke();
  ctx.fillStyle='rgba(120,70,10,.38)';
  for(let k=0;k<8;k++){ctx.save();ctx.rotate(k*TAU/8);ctx.beginPath();ctx.ellipse(0,-r*.46,r*.075,r*.2,0,0,TAU);ctx.fill();ctx.restore()}
  ctx.font=`800 ${r*.62}px ${F_T}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(110,62,8,.82)';ctx.fillText('฿',0,r*.04);
  const sh=ctx.createLinearGradient(-r,-r,r,r);const p=(spin*.35)%1;
  sh.addColorStop(clamp(p-.12),'rgba(255,255,255,0)');sh.addColorStop(clamp(p),'rgba(255,255,255,.4)');sh.addColorStop(clamp(p+.12),'rgba(255,255,255,0)');
  ctx.fillStyle=sh;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
  ctx.restore();ctx.restore();
}
function gate(x0,open,t,errA=0){
  const n=7,cw=92,gap=18,ch=760,y0=160,col=open>.15?TEAL:ROSE;
  glow(x0+(n*(cw+gap))/2,540,520,col,.14*(1-open*.5));
  for(let i=0;i<n;i++){

 {act:1,d:12,label:'ThaiFi storefront',vo:'Already in use for game top-ups on ThaiFi.',draw:s7},
 {act:1,d:12,label:'Rails to Southeast Asia',vo:"Stablecoin rails proved the idea. We're bringing it to Southeast Asia, in local currency, on Cardano.",draw:s8},
 {act:2,d:12,label:'Agent identity',vo:'Every agent gets a verifiable identity through Masumi.',draw:s9},
 {act:2,d:12,label:'Escrow',vo:'Payment is held in escrow on Cardano until the job is done.',draw:s10},
 {act:2,d:12,label:'Delivery and settlement',vo:'Delivered, verified, settled in seconds.',draw:s11},
 {act:2,d:12,label:'On-chain decision log',vo:'And every decision is logged on-chain. Auditable and accountable.',draw:s12},
 {act:3,d:24,label:'Live demo',vo:'Here it is live. An agent requests a top-up, pays in ThaiCoin, and settles through Masumi on Cardano.',draw:s13,placeholder:true,cap:[[1,23,null]]},
 {act:3,d:12,label:'Close',vo:'ThaiCoin. Money that agents can trust.',draw:s14,cap:[[.6,5,null]]},
];
let acc=0;SC.forEach(s=>{s.t0=acc;acc+=s.d;s.t1=acc});
const DUR=acc;
const ACTS=['Problem','ThaiCoin','Masumi on Cardano','Demo and close'];

/* ---------- captions ---------- */
function wrapLines(s,maxW){
  ctx.font=`600 42px ${F_D}`;const words=s.split(' ');const out=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w}else cur=t}
  out.push(cur);return out;
}
function drawCaption(s,lt){
  const c=(s.cap&&s.cap[0])||[.7,s.d-.7,null];
  const a=sm(c[0],c[0]+.45,lt)*(1-sm(c[1]-.45,c[1],lt));
  if(a<=0||!state.caps)return;
  const g=ctx.createLinearGradient(0,H-300,0,H);g.addColorStop(0,'rgba(4,6,12,0)');g.addColorStop(1,`rgba(4,6,12,${.78*a})`);ctx.fillStyle=g;ctx.fillRect(0,H-300,W,300);
  const lines=wrapLines(c[2]||s.vo,1480);
  ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font=`600 42px ${F_D}`;ctx.fillStyle=`rgb(${PAPER})`;
  ctx.shadowColor='rgba(0,0,0,.7)';ctx.shadowBlur=14;
  const y0=H-82-(lines.length-1)*56;lines.forEach((l,i)=>ctx.fillText(l,W/2,y0+i*56+(1-a)*10));
  ctx.restore();
}

/* ---------- render ---------- */
function sceneAt(t){for(let i=0;i<SC.length;i++)if(t<SC[i].t1)return i;return SC.length-1}
const state={caps:true,snd:true,nar:false,clean:false};
function render(t){
  const i=sceneAt(t),s=SC[i],lt=clamp(t-s.t0,0,s.d);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);ctx.save();
  s.draw(lt,s.d);ctx.restore();
  drawCaption(s,lt);
  const fin=i===0?0:(1-sm(0,.5,lt)),fout=i===SC.length-1?sm(s.d-1.4,s.d,lt):sm(s.d-.5,s.d,lt);
  const fa=Math.max(fin,fout);
  if(fa>0){ctx.fillStyle=`rgba(7,11,20,${fa})`;ctx.fillRect(0,0,W,H)}
}

/* ---------- audio ---------- */
let AC=null,master=null,dest=null;
function audioInit(){
  if(AC)return;
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0;master.connect(AC.destination);
    dest=AC.createMediaStreamDestination();master.connect(dest);
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=520;lp.connect(master);
    [[55,'sine',.5],[82.4,'sine',.35],[110.3,'triangle',.12],[164.8,'sine',.08]].forEach(([f,ty,g])=>{const o=AC.createOscillator();o.type=ty;o.frequency.value=f;const gg=AC.createGain();gg.gain.value=g;o.connect(gg);gg.connect(lp);o.start()});
    const lfo=AC.createOscillator();lfo.frequency.value=.07;const lg=AC.createGain();lg.gain.value=220;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  }catch(e){AC=null}
}
function audioSync(){if(!AC)return;try{if(AC.state==='suspended'&&playing)AC.resume();master.gain.setTargetAtTime(state.snd&&playing?.2:0,AC.currentTime,.4)}catch(e){}}
function chime(big){
  if(!AC||!state.snd||!playing)return;
  try{[659.3,987.8,big?1318.5:0].forEach((f,i)=>{if(!f)return;const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;const t0=AC.currentTime+i*.09;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.09,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+2.2);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+2.4)})}catch(e){}
}
function speak(txt){
  try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();if(!state.nar||!txt)return;const u=new SpeechSynthesisUtterance(txt);u.rate=.95;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}
}

/* ---------- ui ---------- */
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
let t=0,playing=false,started=false,last=0,cur=-1,dragging=false;
const POSTER=53.2;
function setPlaying(v){
  playing=v;if(v){started=true;audioInit()}
  $('play').textContent=v?'Pause':(t>=DUR-.05?'Replay':'Play');
  $('big').hidden=v||(started&&t>0&&t<DUR-.05);
  $('bigl').textContent=t>=DUR-.05?'Replay film':'Play film · 3:00';
  audioSync();if(!v)try{speechSynthesis.cancel()}catch(e){}
}
function seek(x,keep){
  t=clamp(x,0,DUR);started=true;cur=-1;
  try{speechSynthesis.cancel()}catch(e){}
  if(!keep&&!playing)$('big').hidden=true;
}
function toggle(){if(t>=DUR-.05)t=0;setPlaying(!playing)}
function sceneChanged(i){
  const s=SC[i];$('live').textContent=s.vo;
  document.querySelectorAll('.ch').forEach((b,k)=>b.setAttribute('aria-current',k===i?'true':'false'));
  $('chip').hidden=!s.placeholder||state.clean;
  if(playing){chime(i===4);if(t-s.t0<1.5)speak(s.cap&&s.cap[0]&&s.cap[0][2]||s.vo)}
}
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing){t=Math.min(DUR,t+dt);if(t>=DUR){setPlaying(false)}}
  const rt=(!started&&t===0)?POSTER:t,i=sceneAt(rt);
  if(i!==cur){cur=i;sceneChanged(i)}
  render(rt);
  $('tnow').textContent=fmt(t);if(!dragging)$('scrub').value=t;
  requestAnimationFrame(frame);
}
// chapters
(()=>{
  const host=$('acts');
  ACTS.forEach((name,a)=>{
    const sec=document.createElement('section');sec.className='act';
    const first=SC.find(s=>s.act===a),lastS=[...SC].reverse().find(s=>s.act===a);
    sec.innerHTML=`<h2><span>${name}</span><span>${fmt(first.t0)}–${fmt(lastS.t1)}</span></h2><ul></ul>`;
    const ul=sec.querySelector('ul');
    SC.forEach((s,i)=>{if(s.act!==a)return;const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.className='ch';b.innerHTML=`<i>${fmt(s.t0)}</i><span>${s.label}</span>`;b.addEventListener('click',()=>{seek(s.t0);if(!playing)setPlaying(true)});li.appendChild(b);ul.appendChild(li)});
    host.appendChild(sec);
  });
})();
$('play').addEventListener('click',toggle);
$('big').addEventListener('click',toggle);
$('restart').addEventListener('click',()=>{seek(0);setPlaying(true)});
const scrub=$('scrub');
scrub.addEventListener('input',()=>{dragging=true;seek(parseFloat(scrub.value))});
scrub.addEventListener('change',()=>{dragging=false});
function pressed(id,k,fn){const b=$(id);b.addEventListener('click',()=>{state[k]=!state[k];b.setAttribute('aria-pressed',state[k]);if(fn)fn()})}
pressed('bcap','caps');pressed('bsnd','snd',audioSync);pressed('bnar','nar',()=>{if(state.nar&&playing){const s=SC[sceneAt(t)];speak(s.vo)}else{try{speechSynthesis.cancel()}catch(e){}}});
function clean(v){state.clean=v;document.body.classList.toggle('clean',v);$('chip').hidden=!SC[sceneAt(t)].placeholder||v}
$('bclean').addEventListener('click',()=>clean(true));
function fs(){const el=$('stage');try{if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen&&el.requestFullscreen().catch(()=>{})}catch(e){}}
$('bfs').addEventListener('click',fs);
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input[type=range]')&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))return;
  const k=e.key;
  if(k===' '||k==='k'){e.preventDefault();toggle()}
  else if(k==='ArrowRight')seek(t+5);
  else if(k==='ArrowLeft')seek(t-5);
  else if(k===']'){const i=sceneAt(t);if(i<SC.length-1)seek(SC[i+1].t0)}
  else if(k==='['){const i=sceneAt(t);seek(t-SC[i].t0>2?SC[i].t0:SC[Math.max(0,i-1)].t0)}
  else if(k==='h'||k==='H')clean(!state.clean);
  else if(k==='f'||k==='F')fs();
  else if(k==='Escape'&&state.clean)clean(false);
});
// recording (works when the file is opened locally; downloads are blocked inside the artifact viewer)
if(location.protocol==='file:'&&window.MediaRecorder){
  const rb=$('brec');rb.hidden=false;
  rb.addEventListener('click',()=>{
    audioInit();clean(true);seek(0);setPlaying(true);
    const stream=cv.captureStream(60);if(dest)dest.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
    const mr=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:14e6});const chunks=[];
    mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    mr.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='thaicoin-pitch-film.webm';a.click();clean(false)};
    mr.start();const iv=setInterval(()=>{if(t>=DUR-.05){clearInterval(iv);mr.stop()}},250);
  });
}
const fontsReady=Promise.all([
  document.fonts.load("800 100px 'Bricolage Grotesque'"),document.fonts.load("600 40px 'Bricolage Grotesque'"),
  document.fonts.load("600 40px 'IBM Plex Sans Thai'"),document.fonts.load("500 20px 'JetBrains Mono'")
]).catch(()=>{});
window.__film={seek:x=>{seek(x);},SC,DUR,render};
setPlaying(false);
let booted=false;const boot=()=>{if(booted)return;booted=true;last=performance.now();requestAnimationFrame(frame)};
fontsReady.then(boot);setTimeout(boot,2500);
})();
</script>
