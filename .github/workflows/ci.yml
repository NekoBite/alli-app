name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the code.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --ci

  bundle:
    # Catches what tsc cannot: a bad import path, a missing native module, or
    # anything Hermes refuses to compile. Metro bundles for both platforms on
    # Linux — no macOS runner needed until there is an actual native build.
    name: Bundle (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Export ${{ matrix.platform }} bundle
        run: npx expo export --platform ${{ matrix.platform }} --output-dir dist-${{ matrix.platform }}
        env:
          EXPO_NO_TELEMETRY: '1'
